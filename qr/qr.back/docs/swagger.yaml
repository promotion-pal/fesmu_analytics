basePath: /
definitions:
  models.Toilet:
    properties:
      created_at:
        example: "2026-05-11T10:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Центральный туалет
        type: string
      rating:
        example: 4.5
        type: number
      updated_at:
        example: "2026-05-11T10:00:00Z"
        type: string
    type: object
  models.ToiletRating:
    properties:
      comment:
        example: Чисто, есть мыло
        type: string
      condition_room:
        example: 8
        maximum: 10
        minimum: 0
        type: integer
      created_at:
        example: "2026-05-11T10:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      soap_available:
        example: true
        type: boolean
      toilet_id:
        example: 1
        type: integer
    type: object
host: localhost:8000
info:
  contact: {}
  description: API для оценки состояния туалетов по QR кодам
  title: QR Toilet API
  version: "1.0"
paths:
  /api/toilets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Toilet'
            type: array
      summary: Получить список туалетов
      tags:
      - toilets
  /api/toilets/{id}/ratings:
    get:
      parameters:
      - description: ID туалета
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ToiletRating'
            type: array
      summary: Получить оценки туалета
      tags:
      - ratings
    post:
      consumes:
      - application/json
      parameters:
      - description: ID туалета
        in: path
        name: id
        required: true
        type: integer
      - description: Данные оценки
        in: body
        name: rating
        required: true
        schema:
          $ref: '#/definitions/models.ToiletRating'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ToiletRating'
      summary: Добавить оценку туалету
      tags:
      - ratings
swagger: "2.0"
