services:
  postgres:
    image: postgres:17
    container_name: "qr-db"
    env_file:
      - .env
    ports:
      - "${SERVER_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qr-network

  back:
    container_name: "qr-back"
    build:
      context: ./qr.back
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - qr-network

  web:
    container_name: "qr-web"
    build:
      context: ./qr.web
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    networks:
      - qr-network

networks:
  qr-network:
    driver: bridge

volumes:
  postgres_data:
