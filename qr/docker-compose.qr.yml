services:
  postgres:
    image: postgres:17
    container_name: "qr-db"
    env_file:
      - .env
    ports:
      - "${SERVER_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qr-network

  back:
    container_name: "qr-back"
    build:
      context: ./qr.back
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - qr-network

  web:
    container_name: "qr-web"
    build:
      context: ./qr.web
      dockerfile: Dockerfile
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qr-web.rule=Host(`fesmu.promotion-pal.ru`)"
      - "traefik.http.routers.qr-web.entrypoints=web"
      - "traefik.http.routers.qr-web.middlewares=redirect-to-https"
      - "traefik.http.routers.qr-web-secure.rule=Host(`fesmu.promotion-pal.ru`)"
      - "traefik.http.routers.qr-web-secure.entrypoints=websecure"
      - "traefik.http.routers.qr-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.qr-web.loadbalancer.server.port=4173"

networks:
  qr-network:
    driver: bridge
  traefik-network:
    external: true

volumes:
  postgres_data:

